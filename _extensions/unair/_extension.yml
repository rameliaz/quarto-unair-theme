title: Universitas Airlangga
author: Rizqy Amelia Zein
version: 2.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: airlangga.scss
      filters:
        - unair.lua
      include-after-body: theme.html
      include-in-header:
        - text: |
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap">