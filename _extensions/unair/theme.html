<script>
// Logos arrive as data URIs in <meta> tags written by unair.lua, so they work
// wherever the rendered page ends up (subfolder, output-dir, embed-resources).
function _unairMeta(name) {
  var meta = document.querySelector('meta[name="' + name + '"]');
  return meta ? meta.content : '';
}

// Every slide gets its own <img>, so hand them one short blob: URL each rather
// than repeating the ~150 KB data URI in every src attribute.
function _unairLogoUrl(name) {
  var uri = _unairMeta(name);
  var match = uri.match(/^data:([^;]+);base64,(.*)$/);
  if (!match || !window.URL || !URL.createObjectURL) return uri;
  var binary = atob(match[2]);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: match[1] }));
}

var UNAIR_LOGO = _unairLogoUrl('unair-logo');
var UNAIR_LOGO_WHITE = _unairLogoUrl('unair-logo-white');

function _unairIsPrinting() {
  return !!((Reveal.isPrintView && Reveal.isPrintView()) ||
    (Reveal.isPrintingPDF && Reveal.isPrintingPDF()));
}

// Single unified function to manage all logos
function manageLogos() {
  // unair.lua couldn't embed the logos (it logs a warning at render time);
  // an <img> with an empty src would show as a broken image.
  if (!UNAIR_LOGO) return;

  const slides = document.querySelectorAll('.reveal .slides section');

  slides.forEach(function(slide) {
    // Vertical-stack wrappers aren't slides themselves; a logo here would
    // show on top of each child slide's own logo.
    if (slide.querySelector('section')) {
      slide.querySelectorAll(':scope > .slide-logo').forEach(logo => logo.remove());
      return;
    }

    // Handle the real title/cover slide. Quarto gives it id="title-slide"
    // but class "quarto-title-block" — NOT class "title-slide". That class
    // is actually assigned by Quarto to any heading-only section-divider
    // slide (`# Heading {background-color="..."}`), so matching on id here
    // is required to avoid also treating those dividers as the cover slide.
    if (slide.id === 'title-slide') {
      // Remove any regular logos from title slide
      const regularLogos = slide.querySelectorAll('.slide-logo');
      regularLogos.forEach(logo => logo.remove());

      // Add centered logo if it doesn't exist
      if (!slide.querySelector('.title-slide-logo')) {
        const titleLogo = document.createElement('img');
        titleLogo.src = UNAIR_LOGO;
        titleLogo.className = 'title-slide-logo';
        titleLogo.alt = 'Universitas Airlangga Logo';
        // The logo has no intrinsic size until it loads, so a pre-load
        // fitCoverFonts() call would see a 0x0 box and under-shrink the title.
        titleLogo.onload = fitCoverFonts;
        slide.insertBefore(titleLogo, slide.firstChild);
      }
      return;
    }

    // For all other slides, ensure only ONE logo exists
    const existingLogos = slide.querySelectorAll('.slide-logo');

    // If multiple logos exist, remove all and start fresh
    if (existingLogos.length > 1) {
      existingLogos.forEach(logo => logo.remove());
    }

    // White logo on UNAIR-blue slides: blue dividers and the closing slide
    const bgColor = slide.getAttribute('data-background-color');
    const logoSrc = (bgColor === '#14497F' || bgColor === '#14497f' || slide.classList.contains('closing-slide'))
      ? UNAIR_LOGO_WHITE
      : UNAIR_LOGO;
    
    // This variant wasn't embedded (unair.lua warned at render time).
    if (!logoSrc) {
      existingLogos.forEach(logo => logo.remove());
      return;
    }

    // If exactly one logo exists, just update its source
    if (existingLogos.length === 1) {
      existingLogos[0].src = logoSrc;
    }
    // If no logo exists, create one
    else if (existingLogos.length === 0) {
      const logo = document.createElement('img');
      logo.src = logoSrc;
      logo.className = 'slide-logo';
      logo.alt = 'Universitas Airlangga Logo';
      // Same reasoning as titleLogo.onload above: the closing slide's heading
      // needs the logo's real size to shrink against, not a pre-load 0x0 box.
      if (slide.classList.contains('closing-slide')) logo.onload = fitCoverFonts;
      slide.appendChild(logo);
    }
  });
}

// Shrinks a cover heading's font size just enough that long text wraps
// without its top line reaching into the corner logo. Re-measures from the
// CSS max size each time rather than only ever shrinking further, so it
// recovers if the heading shortens (e.g. a resize changes how much wraps).
// Covers both slides that pair a big heading with a fixed-position logo in
// the same corner: the title slide (h1.title / .title-slide-logo) and the
// closing slide (its h2 / .slide-logo), which mirror each other's layout.
var UNAIR_COVER_FONT_MAX = 2.6;  // em, matches h1.title/.closing-slide h2 in airlangga.scss
var UNAIR_COVER_FONT_MIN = 1.3;  // em, floor so text stays readable
var UNAIR_COVER_FONT_STEP = 0.1; // em
var UNAIR_COVER_LOGO_GAP = 14;   // px clearance kept below the logo

function _unairFitCoverHeading(headingEl, logoEl) {
  if (!headingEl || !logoEl) return;

  var size = UNAIR_COVER_FONT_MAX;
  headingEl.style.fontSize = size + 'em';

  var headingRect = headingEl.getBoundingClientRect();
  var logoRect = logoEl.getBoundingClientRect();

  // Full rectangle-intersection test (all four half-plane checks), not just
  // the two that happen to matter today — the heading is a block element
  // that always spans the full container width, so the horizontal checks
  // are currently trivial, but that's a property of the CSS, not of this
  // function, and shouldn't be assumed here.
  while (size > UNAIR_COVER_FONT_MIN &&
    headingRect.left < logoRect.right &&
    headingRect.right > logoRect.left &&
    headingRect.bottom > logoRect.top &&
    headingRect.top < logoRect.bottom + UNAIR_COVER_LOGO_GAP) {
    size -= UNAIR_COVER_FONT_STEP;
    headingEl.style.fontSize = size.toFixed(2) + 'em';
    headingRect = headingEl.getBoundingClientRect();
  }
}

function fitCoverFonts() {
  var titleSlide = document.getElementById('title-slide');
  if (titleSlide) {
    _unairFitCoverHeading(titleSlide.querySelector('h1.title'), titleSlide.querySelector('.title-slide-logo'));
  }

  var closingSlide = document.querySelector('.reveal .slides section.closing-slide');
  if (closingSlide) {
    _unairFitCoverHeading(closingSlide.querySelector(':scope > h2'), closingSlide.querySelector('.slide-logo'));
  }
}

// Shrinks `el`'s own font-size (off a cached natural baseline, so repeated
// calls don't compound and later-shorter content can grow back) until its
// rendered content no longer overflows `containerEl`'s laid-out height.
// Deliberately uses clientHeight/scrollHeight rather than
// getBoundingClientRect: those are layout metrics, unaffected by the CSS
// transform Reveal uses to scale the whole deck to fit the viewport, so the
// same authored-pixel comparison holds at any zoom level (see layoutSidebar
// above for the same distinction). Only meaningful while the element is
// actually laid out (not `display:none`) — i.e. while its slide is current.
function _unairShrinkToFit(el, containerEl, opts) {
  if (!el || !containerEl) return;
  opts = opts || {};
  var min = opts.min || 0.5;    // floor, as a fraction of the natural size
  var step = opts.step || 0.04; // fraction per iteration
  var margin = opts.margin || 1; // shrink target = containerEl height * margin

  if (el.dataset.unairBaseFontPx === undefined) {
    var priorSize = el.style.fontSize;
    el.style.fontSize = '';
    el.dataset.unairBaseFontPx = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = priorSize;
  }
  var basePx = parseFloat(el.dataset.unairBaseFontPx);
  if (!basePx) return;

  var factor = 1;
  el.style.fontSize = (basePx * factor) + 'px';
  var targetHeight = containerEl.clientHeight * margin;
  while (factor > min && el.scrollHeight > targetHeight) {
    factor -= step;
    el.style.fontSize = (basePx * factor) + 'px';
  }
}

// Quote slides (`.quote-slide`/`.quote-slide-dark`) centre `.quote-bubble`
// in a fixed-height, `overflow: hidden` section (airlangga.scss) — a long
// quote used to just get silently clipped top/bottom with no visual cue.
// Agenda slides (`.agenda-slide`) size their `ol` via CSS item-count
// breakpoints (`:has(li:nth-child(n))`), which handle item *count* but not
// long items that wrap to extra lines; this adds a dynamic pass on top of
// whatever size the CSS breakpoints land on.
// In the live deck only the current slide's content is laid out
// (non-`display:none`) at any given time, so — unlike fitCoverFonts, which
// targets the title/closing slides unconditionally by id/class — this runs
// against whichever slide `slidechanged` just made current. The print view
// (PDF export) lays out every slide at once, so there it fits all of them.
function _unairFitSlide(slide) {
  if (slide.classList.contains('quote-slide') || slide.classList.contains('quote-slide-dark')) {
    var bubble = slide.querySelector(':scope > .quote-bubble');
    // 0.92: a little breathing room so the shrink target is reached just
    // before the text would actually touch the slide's top/bottom edge.
    _unairShrinkToFit(bubble, slide, { min: 0.5, step: 0.04, margin: 0.92 });
  }

  if (slide.classList.contains('agenda-slide')) {
    var ol = slide.querySelector(':scope > ol');
    // The `ol` is its own fixed-height box (absolutely positioned via
    // top/bottom in the SCSS), so it's both the shrinking element and the
    // container its own content must fit inside.
    _unairShrinkToFit(ol, ol, { min: 0.4, step: 0.04 });
  }
}

function fitOverflowContent() {
  if (_unairIsPrinting()) {
    Reveal.getSlides().forEach(_unairFitSlide);
    return;
  }

  var current = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
  if (current) _unairFitSlide(current);
}

// Sidebar label: the talk's short title. Prefers the `short-title` YAML
// field (surfaced as a <meta> tag by unair.lua); falls back to the full title
// from the title slide (the CSS cuts it off with an ellipsis if too long).
function _unairShortTitle() {
  var meta = document.querySelector('meta[name="unair-short-title"]');
  if (meta && meta.content.trim()) return meta.content.trim();

  var title = document.querySelector('#title-slide .title');
  return title ? title.textContent.replace(/\s+/g, ' ').trim() : '';
}

// Slides that keep their own full-bleed treatment and get no sidebar.
// Section dividers are matched by data-background-color, the cover by id
// (see manageLogos above for why not by class).
var UNAIR_SIDEBAR_EXCLUDED_CLASSES = ['quote-slide', 'quote-slide-dark', 'agenda-slide', 'closing-slide', 'no-sidebar'];

// The number Reveal itself would show for `slide`, following the same rules as
// its internal slide-number controller: `h.v` / `h/v` formats, a
// `slideNumber` function, and `data-visibility="uncounted"` slides. For the
// `c/t` format (what `slide-number: true` gives in Quarto) only the count is
// shown, since the yellow block has no room for the total.
function _unairSlideNumber(slide) {
  var config = Reveal.getConfig().slideNumber;
  if (typeof config === 'function') {
    var parts = config(slide);
    return Array.isArray(parts) ? parts.join('') : String(parts);
  }

  var format = typeof config === 'string' ? config : 'h.v';
  if (!/c/.test(format) && Reveal.getHorizontalSlides().length === 1) format = 'c';
  var own = slide.dataset.visibility === 'uncounted' ? 0 : 1;

  if (/c/.test(format)) return String(Reveal.getSlidePastCount(slide) + own);

  var indices = Reveal.getIndices(slide);
  var number = String(indices.h + own);
  if (Reveal.isVerticalSlide(slide)) number += (format === 'h/v' ? '/' : '.') + (indices.v + 1);
  return number;
}

// Brand sidebar on the right edge of each content slide, after the page
// frame in the UNAIR guideline PDF: key graphic + the talk's short title on a
// blue bar, slide number on a yellow block at the bottom.
// Built per slide (not one shared overlay) so it also appears on every page
// of a PDF export, each with its own number.
function manageSidebar() {
  var showNumber = !!Reveal.getConfig().slideNumber;
  var label = _unairShortTitle();

  Reveal.getSlides().forEach(function(slide) {
    var bar = slide.querySelector(':scope > .unair-sidebar');
    var excluded = slide.id === 'title-slide' ||
      slide.hasAttribute('data-background-color') ||
      UNAIR_SIDEBAR_EXCLUDED_CLASSES.some(function(c) { return slide.classList.contains(c); });

    if (excluded) {
      if (bar) bar.remove();
      slide.classList.remove('has-unair-sidebar');
      return;
    }

    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'unair-sidebar';
      bar.setAttribute('aria-hidden', 'true');
      bar.innerHTML = '<span class="unair-sidebar-mark"></span>' +
        '<span class="unair-sidebar-label"></span>' +
        '<span class="unair-sidebar-number"></span>';
      slide.appendChild(bar);
    }
    bar.querySelector('.unair-sidebar-label').textContent = label;
    bar.querySelector('.unair-sidebar-number').textContent = showNumber ? _unairSlideNumber(slide) : '';
    slide.classList.add('has-unair-sidebar');
  });
}

// Pushes the sidebar out to the far right edge of the screen. Reveal scales
// the slide to fit and letterboxes it, so the empty margin beside the slide
// depends on the screen's aspect ratio; measure it (in unscaled slide px) and
// hand it to the SCSS as custom properties. When the margin is narrower than
// the bar, the overlap/clearance values tell slides how much room to make.
var UNAIR_SIDEBAR_WIDTH = 72;  // $unair-sidebar-width in airlangga.scss
var UNAIR_SIDEBAR_GAP = 32;    // $unair-sidebar-gap

function layoutSidebar() {
  var reveal = Reveal.getRevealElement();
  var offset = 0;

  if (!_unairIsPrinting()) {
    var scale = Reveal.getScale() || 1;
    offset = Math.max(0, (reveal.getBoundingClientRect().width / scale - Reveal.getConfig().width) / 2);
  }

  var overlap = Math.max(0, UNAIR_SIDEBAR_WIDTH - offset);
  var clearance = Math.max(0, UNAIR_SIDEBAR_WIDTH + UNAIR_SIDEBAR_GAP - offset);
  reveal.style.setProperty('--unair-sidebar-offset', offset + 'px');
  reveal.style.setProperty('--unair-sidebar-overlap', overlap + 'px');
  reveal.style.setProperty('--unair-sidebar-clearance', clearance + 'px');
}

// Initialize on page load. This file is included after the body, so by
// DOMContentLoaded the Reveal script has run and the global exists.
document.addEventListener('DOMContentLoaded', function() {
  if (typeof Reveal === 'undefined') return;

  var onReady = [manageSidebar, layoutSidebar, manageLogos, fitCoverFonts, fitOverflowContent];
  if (Reveal.isReady()) {
    onReady.forEach(function(fn) { fn(); });
  } else {
    onReady.forEach(function(fn) { Reveal.on('ready', fn); });
  }
  Reveal.on('resize', layoutSidebar);
  Reveal.on('resize', fitCoverFonts);
  Reveal.on('resize', fitOverflowContent);
  // Re-run on every slide change, like the logos: both are idempotent, and
  // this self-heals the rare load where the sidebar went missing.
  Reveal.on('slidechanged', manageSidebar);
  Reveal.on('slidechanged', layoutSidebar);
  Reveal.on('slidechanged', manageLogos);
  Reveal.on('slidechanged', fitCoverFonts);
  Reveal.on('slidechanged', fitOverflowContent);
  // The print view (PDF export) finishes laying out every slide after
  // 'ready'; measure again once it has.
  Reveal.on('pdf-ready', fitCoverFonts);
  Reveal.on('pdf-ready', fitOverflowContent);
});
</script>
